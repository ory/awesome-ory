services:
  quarkus:
    build:
      context: .
    environment:
      # The app calls Kratos over the compose network, but sends the browser to
      # the published port.
      - QUARKUS_REST_CLIENT_KRATOS_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://127.0.0.1:4433
    depends_on:
      - kratos
    ports:
      - "8080:8080"
    networks:
      - intranet

  postgres-kratos:
    extends:
      file: ../_common/docker-compose.yml
      service: postgres-kratos

  # The app renders the login and registration pages itself, so Kratos needs
  # this example's own config, which points its UI URLs at the app. Volumes are
  # merged by target path, so this replaces the shared config directory.
  kratos-migrate:
    extends:
      file: ../_common/docker-compose.yml
      service: kratos-migrate
    depends_on:
      postgres-kratos:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos

  kratos:
    extends:
      file: ../_common/docker-compose.yml
      service: kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos

  mailpit:
    extends:
      file: ../_common/docker-compose.yml
      service: mailpit

networks:
  intranet:
