dsn: memory

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:8080/
  allowed_return_urls:
    - http://127.0.0.1:8080

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:8080/error

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:8080/

    login:
      ui_url: http://127.0.0.1:8080/auth/login
      lifespan: 10m
      after:
        default_browser_return_url: http://127.0.0.1:8080/

    registration:
      lifespan: 10m
      ui_url: http://127.0.0.1:8080/auth/registration
      after:
        default_browser_return_url: http://127.0.0.1:8080/
        password:
          default_browser_return_url: http://127.0.0.1:8080/
          hooks:
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 2
    salt_length: 16
    key_length: 16

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
