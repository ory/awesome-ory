# Where the app calls Kratos from the server. In docker-compose this is
# overridden with QUARKUS_REST_CLIENT_KRATOS_URL=http://kratos:4433.
quarkus.rest-client.kratos.url=http://127.0.0.1:4433
# Where the browser reaches Kratos. Links and redirects use this one.
kratos.browser-url=http://127.0.0.1:4433
