services:
  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    ports:
      - 8080:4455
      - 4456:4456
    command: serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    networks:
      - intranet
    extra_hosts:
      # The cookie_session authenticator calls the Ory tunnel, which runs on the
      # host rather than in this network.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper

  hello:
    build:
      context: "../../_common/hello"
    networks:
      - intranet

  hydrator:
    build:
      context: "../../_common/hydrator"
    networks:
      - intranet

networks:
  intranet:
