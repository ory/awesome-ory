services:
  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    ports:
      - 8080:4455
      - 4456:4456
    command: serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    networks:
      - intranet
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper

  hello:
    build:
      context: "../../_common/hello"
    networks:
      - intranet

networks:
  intranet:
