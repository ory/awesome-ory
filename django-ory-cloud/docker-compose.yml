services:
  django:
    build:
      context: .
    environment:
      # Self-hosted Ory. Point these at your Ory Network project instead to run
      # the same app against the managed service.
      - ORY_SDK_URL=http://kratos:4433
      - ORY_UI_URL=http://127.0.0.1:4455
    depends_on:
      - kratos
    ports:
      - "8000:8000"
    networks:
      - intranet

  postgres-kratos:
    extends:
      file: ../_common/docker-compose.yml
      service: postgres-kratos

  kratos-migrate:
    extends:
      file: ../_common/docker-compose.yml
      service: kratos-migrate
    depends_on:
      postgres-kratos:
        condition: service_healthy

  kratos:
    extends:
      file: ../_common/docker-compose.yml
      service: kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  kratos-selfservice-ui-node:
    extends:
      file: ../_common/docker-compose.yml
      service: kratos-selfservice-ui-node

  mailpit:
    extends:
      file: ../_common/docker-compose.yml
      service: mailpit

networks:
  intranet:
